<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <title>Budapest, épületenként</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <style>
    html, body, #terkep { margin: 0; height: 100%; font-family: sans-serif; }
    .panel {
      position: absolute; background: white; padding: 10px 14px; border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3); font-size: 13px;
    }
    #jelmagyarazat { left: 10px; bottom: 30px; }
    #jelmagyarazat div { margin: 3px 0; }
    #jelmagyarazat span {
      display: inline-block; width: 14px; height: 14px;
      margin-right: 6px; vertical-align: middle;
    }
    #kapcsolok { left: 10px; top: 10px; max-width: 260px; }
    #kapcsolok label { display: block; margin: 4px 0; cursor: pointer; }
    #kapcsolok small { color: #555; }
  </style>
</head>
<body>
  <div id="terkep"></div>

  <div id="kapcsolok" class="panel">
    <strong>Rétegek</strong>
    <label><input type="checkbox" id="kiemel">
      Lechner-épületek kiemelése<br>
      <small>a többi épület halványabb lesz</small></label>
    <label><input type="checkbox" id="vedett">
      Védett épületek kiemelése<br>
      <small>műemlék, helyi védelem; a többi épület szürke lesz</small></label>
    <label><input type="checkbox" id="kozeli">
      Közeli találatok magentával<br>
      <small>a Lechner-pont nem esett az épületbe, ellenőrizendő</small></label>
  </div>

  <div id="jelmagyarazat" class="panel">
    <strong>Építési év</strong>
    <div><span style="background:#7a1f1f"></span>1850 előtt</div>
    <div><span style="background:#d9653b"></span>1850–1899</div>
    <div><span style="background:#e8b04a"></span>1900–1944</div>
    <div><span style="background:#6aa84f"></span>1945–1989</div>
    <div><span style="background:#3d85c6"></span>1990 után</div>
    <div><span style="background:#9aa0a6"></span>ismeretlen</div>
    <div><span style="background:#d4189c"></span>Lechner, közeli találat</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script>
    const ADATFAJL = "data/belvaros_epuletek_vegleges.geojson";

    const EV_SZINEK = [
      "step", ["to-number", ["get", "ev"], 0],
      "#9aa0a6",
      1, "#7a1f1f",
      1850, "#d9653b",
      1900, "#e8b04a",
      1945, "#6aa84f",
      1990, "#3d85c6"
    ];
    const KOZELI_SZIN = "#d4189c";
    const RETEGEK = ["epuletek-alap", "epuletek-lechner", "epuletek-kozeli"];

    const terkep = new maplibregl.Map({
      container: "terkep",
      style: {
        version: 8,
        sources: {
          osm: {
            type: "raster",
            tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
            tileSize: 256,
            attribution: "© OpenStreetMap közreműködők | Épületadatok: OpenStreetMap, EUBUCCO, Wikidata, Lechner Tudásközpont, műemlékjegyzék, Főv. Kgy. 54/1993. rendelet, Belváros-Lipótváros településképi kézikönyve"
          }
        },
        layers: [{ id: "alap", type: "raster", source: "osm" }]
      },
      center: [19.051, 47.5015],
      zoom: 16,
      pitch: 55,
      bearing: -20
    });
    terkep.addControl(new maplibregl.NavigationControl());

    function reteg(id, szuro, opacity) {
      terkep.addLayer({
        id: id,
        type: "fill-extrusion",
        source: "epuletek",
        filter: szuro,
        paint: {
          "fill-extrusion-height": ["get", "magassag"],
          "fill-extrusion-opacity": opacity,
          "fill-extrusion-color": EV_SZINEK
        }
      });
    }

    terkep.on("load", () => {
      terkep.addSource("epuletek", { type: "geojson", data: ADATFAJL });

      const lechnerVan = ["has", "lechner_nev"];
      const kozeli = ["==", ["get", "lechner_illesztes"], "kozeli"];

      // 1) minden épület, amelyhez nincs Lechner-adat
      reteg("epuletek-alap", ["!", lechnerVan], 0.9);
      // 2) Lechner-épületek, amelyeknek a pontja az épületbe esik
      reteg("epuletek-lechner", ["all", lechnerVan, ["!", kozeli]], 1);
      // 3) Lechner-épületek, amelyeket csak közelség alapján párosítottunk
      reteg("epuletek-kozeli", ["all", lechnerVan, kozeli], 1);
    });

    // --- kapcsolók ---
    const VEDETT = ["any", ["has", "vedettseg"], ["has", "vedettseg_helyi"]];
    const NEM_VEDETT_SZIN = "#d0d0d0";

    function frissitStilus() {
      const kiemel = document.getElementById("kiemel").checked;
      const kozeliJelol = document.getElementById("kozeli").checked;
      const vedettKiemel = document.getElementById("vedett").checked;
      terkep.setPaintProperty("epuletek-alap", "fill-extrusion-opacity", kiemel ? 0.3 : 0.9);
      RETEGEK.forEach((id) => {
        const alap = (id === "epuletek-kozeli" && kozeliJelol) ? KOZELI_SZIN : EV_SZINEK;
        terkep.setPaintProperty(id, "fill-extrusion-color",
          vedettKiemel ? ["case", VEDETT, alap, NEM_VEDETT_SZIN] : alap);
      });
    }
    ["kiemel", "kozeli", "vedett"].forEach((id) => {
      document.getElementById(id).addEventListener("change", () => {
        if (terkep.getLayer("epuletek-alap")) frissitStilus();
      });
    });

    // --- popup ---
    function biztonsagos(szoveg) {
      const div = document.createElement("div");
      div.textContent = String(szoveg);
      return div.innerHTML;
    }

    const FORRAS_NEVEK = {
      kezi: "kézi javítás",
      osm: "OpenStreetMap",
      lechner: "Lechner Tudásközpont",
      lechner_kozeli: "Lechner Tudásközpont, közeli találat (ellenőrizendő)",
      muemlek: "műemlékjegyzék",
      helyi_vedelem: "fővárosi helyi védelmi lista (2001)",
      wikidata: "Wikidata",
      wikidata_kozeli: "Wikidata, közeli találat (ellenőrizendő)",
      eubucco: "EUBUCCO",
      szintterkep: "kerületi szintszám-térkép"
    };
    const VEDETTSEG_NEVEK = {
      M: "műemlék", MJ: "műemlék jellegű", VK: "városképi jelentőségű",
      MK: "műemléki környezet", MJT: "műemléki jelentőségű terület"
    };

    function evForras(p) {
      if (!p.ev) return "";
      if (p.ev_forras === "osm" || !FORRAS_NEVEK[p.ev_forras]) {
        return "OpenStreetMap" + (p.ev_forras && p.ev_forras !== "osm" ? " (" + p.ev_forras + ")" : "");
      }
      return FORRAS_NEVEK[p.ev_forras];
    }

    function magassagSor(p) {
      const m = Math.round(p.magassag) + " m";
      switch (p.magassag_forras) {
        case "height": return `Magasság: ${m} <small>(OpenStreetMap, megadott érték)</small><br>`;
        case "eubucco_becsles": {
          const sav = (p.eubucco_magassag_min != null && p.eubucco_magassag_max != null)
            ? `, becslési sáv ${Math.round(p.eubucco_magassag_min)}–${Math.round(p.eubucco_magassag_max)} m` : "";
          return `Magasság: ${m} <small>(EUBUCCO, gépi tanulással becsült${sav})</small><br>`;
        }
        case "eubucco_forras": return `Magasság: ${m} <small>(EUBUCCO, forrásadatból)</small><br>`;
        case "szintszam": return `Magasság: ${m} <small>(szintszámból számolt, 3 m/szint)</small><br>`;
        case "szintterkep": return `Magasság: ${m} <small>(szintszám-térképből számolt, 3 m/szint)</small><br>`;
        default: return `Magasság: ${m} <small>(alapértelmezett, nincs adat)</small><br>`;
      }
    }

    function szintSor(p) {
      if (!p.szintek) return "";
      let sor = `Szintszám: ${biztonsagos(p.szintek)} <small>(${biztonsagos(FORRAS_NEVEK[p.szintek_forras] || p.szintek_forras || "")})</small>`;
      if (p.szint_eltero && p.szintek_osm) sor += ` <small>OSM: ${biztonsagos(p.szintek_osm)}</small>`;
      return sor + "<br>";
    }

    function vedettsegSor(p) {
      const reszek = [];
      if (p.vedettseg) reszek.push(VEDETTSEG_NEVEK[p.vedettseg] || p.vedettseg);
      if (p.vedettseg_helyi) reszek.push(p.vedettseg_helyi);
      return reszek.length ? `Védettség: ${biztonsagos(reszek.join(", "))}<br>` : "";
    }

    function popupHtml(p) {
      let html = `<strong>${biztonsagos(p.nev || p.lechner_nev || "névtelen épület")}</strong><br>`;
      html += `Típus: ${biztonsagos(p.tipus || "?")}<br>`;
      html += `Építési év: ${p.ev ? biztonsagos(p.ev) : "ismeretlen"}`;
      if (p.ev) html += ` <small>(${biztonsagos(evForras(p))})</small>`;
      html += "<br>";
      if (p.tervezo) {
        html += `Tervező: ${biztonsagos(p.tervezo)}`;
        if (p.tervezo_forras) html += ` <small>(${biztonsagos(FORRAS_NEVEK[p.tervezo_forras] || p.tervezo_forras)})</small>`;
        html += "<br>";
      }
      if (p.stilus) html += `Stílus: ${biztonsagos(p.stilus)}<br>`;
      html += vedettsegSor(p);
      html += szintSor(p);
      html += magassagSor(p);
      html += `OSM-azonosító: ${biztonsagos((p.osm_tipus || "way") + " " + p.id)}`;
      if (/^Q\d+$/.test(p.wikidata_id || "")) {
        html += `<br><a href="https://www.wikidata.org/wiki/${p.wikidata_id}" target="_blank" rel="noopener">Wikidata: ${p.wikidata_id}</a>`;
      }
      if (p.lechner_nev) {
        html += `<hr style="margin:6px 0">`;
        html += `<em>Lechner Tudásközpont</em><br>`;
        html += `Megnevezés: ${biztonsagos(p.lechner_nev)}<br>`;
        if (p.lechner_epult) html += `Épült: ${biztonsagos(p.lechner_epult)}<br>`;
        if (p.lechner_tervezo) html += `Tervező: ${biztonsagos(p.lechner_tervezo)}<br>`;
        if (p.lechner_illesztes === "kozeli") {
          html += `<small>A pont nem esik az épületbe, csak a közelébe, a párosítás bizonytalan.</small>`;
        }
      }
      return html;
    }

    terkep.on("click", (e) => {
      const talalatok = terkep.queryRenderedFeatures(e.point, { layers: RETEGEK });
      if (!talalatok.length) return;
      new maplibregl.Popup({ maxWidth: "320px" })
        .setLngLat(e.lngLat)
        .setHTML(popupHtml(talalatok[0].properties))
        .addTo(terkep);
    });

    terkep.on("mousemove", (e) => {
      const van = terkep.queryRenderedFeatures(e.point, { layers: RETEGEK }).length > 0;
      terkep.getCanvas().style.cursor = van ? "pointer" : "";
    });
  </script>
</body>
</html>
